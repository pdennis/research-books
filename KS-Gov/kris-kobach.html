<h1 style="text-align:center;"><strong>How To Win Against Kris Kobach</strong></h1>
<figure class="table" style="float:left;">

          <p>Kansas Attorney General Kris Kobach was an out-of-touch extremist who refused to stand up for Kansas and repeatedly attacked Kansans’ healthcare, food assistance, and voting rights. Kobach supported restricting Medicaid through work requirements, and opposed Medicaid expansion and the Affordable Care Act. He backed Trump’s disastrous tariffs that hurt Kansas small businesses and the agricultural industry. Kobach also supported handing over sensitive SNAP data to the Trump administration and wanted to impose requirements that would make it harder for Kansans to afford groceries. He refused to defend Kansas’ critical grants from DOGE cuts as the cuts hindered Kansas’ ability to provide critical services and federal workers in Kansas were laid off. Kobach repeatedly attacked Kansas’ fundamental right to abortion and attempted to threaten Kansans’ access to abortion medication. Kobach also had a record of opposing rights to the LGBTQ+ community, like their ability to adopt or foster children, and used extreme anti-LGBTQ+ rhetoric. Kobach’s support for Trump’s deployment of federal forces against the consent of governors raised concerns about whether he would protect Kansans from Trump overstepping his authority. Kobach repeatedly promoted baseless conspiracies of voter fraud and helped strategize a lawsuit to overturn the 2020 election. Kobach also had a history of lining his own pockets at the expense of taxpayers on personal and partisan battles.</p>
          <h3><strong>Kris Kobach Supported Restricting Medicaid And Opposed The Affordable Care Act</strong></h3>
          <ul>
            <li>In 2018, Kris Kobach <a href="https://www.breitbart.com/midterm-election/2018/10/17/kris-kobachs-welfare-reform-drug-tests-for-food-stamps-end-benefits-for-illegal-aliens/"><u>proposed</u></a> imposing work requirements for Medicaid recipients in Kansas, saying it was “time to move people off welfare into jobs.” Kobach’s support for Medicaid work requirements aligned with <a href="https://www.kff.org/medicaid/a-closer-look-at-the-work-requirement-provisions-in-the-2025-federal-budget-reconciliation-law/"><u>Trump’s “One Big Beautiful Bill” and its work requirements</u></a> that were projected to strip more than <a href="https://www.jec.senate.gov/public/_cache/files/9cfdee90-dd29-41e8-97da-b5dcdc0317cf/updated-jec-fact-sheet-on-district-level-impacts-of-health-care-cuts.pdf"><u>18,000 Medicaid recipients in Kansas</u></a> of their health insurance by 2034. Additionally, Kobach <a href="https://www.breitbart.com/midterm-election/2018/10/17/kris-kobachs-welfare-reform-drug-tests-for-food-stamps-end-benefits-for-illegal-aliens/"><u>proposed</u></a> imposing <a href="https://www.familiesusa.org/resources/drug-testing-in-medicaid-is-illegal-and-hurts-the-people-who-need-help-most/"><u>illegal</u></a> drug testing requirements for Medicaid recipients in Kansas.&nbsp;</li>
            <li>Kobach repeatedly <a href="https://x.com/KrisKobach1787/status/1459205599711825928"><u>voiced</u></a> scrutiny and opposition to the Affordable Care Act, claiming the healthcare law was <a href="https://www.breitbart.com/politics/2019/07/31/kris-kobach-democrats-offer-free-healthcare-to-illegals-while-americans-forced-to-buy-obamacare/"><u>“foisted upon”</u></a> Americans. In 2026, <a href="https://www.kff.org/affordable-care-act/state-indicator/open-enrollment-marketplace-plan-selections/?currentTimeframe=0&amp;selectedRows=%7B%22states%22:%7B%22kansas%22:%7B%7D%7D%7D&amp;sortModel=%7B%22colId%22:%22Location%22,%22sort%22:%22asc%22%7D"><u>nearly 193,000 Kansans</u></a> relied on Affordable Care Act marketplace plans for their health care.</li>
            <li>Kobach also opposed <a href="https://x.com/KrisKobach1787/status/1055619373229137920"><u>Medicaid</u></a> <a href="https://x.com/KrisKobach1787/status/1038466609789194240"><u>expansion</u></a>, even though it could expand access to healthcare for <a href="https://www.npr.org/2024/04/22/1245146972/kansas-alabama-medicaid-expansion-uninsured-health-care-obamacare"><u>150,000 Kansans</u></a>.</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach supported stripping away health care from thousands of Kansans who relied on Medicaid.</p>
          <h3><strong>Kris Kobach Backed Trump's Tariffs, Endangering Kansas’ Economy</strong></h3>
          <ul>
            <li>In 2026, Kris Kobach <a href="https://x.com/KrisKobach1787/status/2026490481547301203"><u>praised</u></a> Trump’s tariffs and claimed his tariffs returned the “tradition” of imposing tariffs on foreign imports as the primary source of federal revenue. Kobach praised the tariffs even though the&nbsp; <a href="https://www.npr.org/2025/04/04/nx-s1-5352362/markets-selloff-dow-trump-tariffs"><u>U.S. stock market crashed</u></a> in April 2025 due to Trump’s escalating global trade war.</li>
            <li>Trump’s tariffs and trade war were hurting Kansas’ small businesses and agricultural industry, including <a href="https://jcpost.com/posts/d5263f88-f64c-43b6-83f3-164df680ba65"><u>soybean farmers</u></a>. Trump’s tariffs impacted <a href="https://www.wibw.com/2025/03/11/there-is-some-uncertainty-kansas-ag-anticipates-impact-looming-tariffs/"><u>Kansas’ agricultural industry</u></a> due to the large exports of grain and soybeans to Mexico. From March 2025 to February 2026, Kansas’ small business importers paid an average of <a href="https://www.americanprogress.org/article/in-the-first-year-president-trumps-tariffs-have-cost-small-business-importers-306000-on-average/"><u>$189,000 in additional tariffs.</u></a> The tariffs also impacted and disrupted Kansas small businesses, including <a href="https://www.wibw.com/2025/03/11/there-is-some-uncertainty-kansas-ag-anticipates-impact-looming-tariffs/"><u>Z&amp;M Twisted Vines Vineyard in Lawrence</u></a>, <a href="https://www.kshb.com/news/local-news/missouri/kansas-city/small-business-owners-in-kansas-city-say-tariff-uncertainty-has-already-cost-them-regardless-of-court-rulings"><u>Rochester Brewing and Roasting in Kansas City, and The Active Hamper in Parkville</u></a>.</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach supported Trump’s tariffs even as the policies and the trade war hurt Kansas small businesses and the agricultural industry.</p>
          <h3><strong>Kris Kobach Supported SNAP And TANF Cuts And Handing Over Sensitive SNAP Data To The Trump Administration</strong></h3>
          <p>From 2025 to 2026, Kris Kobach supported the <a href="https://www.cjonline.com/story/news/politics/government/2026/03/27/kansas-supreme-court-rules-in-laura-kelly-lawsuit-against-kris-kobach/89331292007/"><u>Trump administration’s request</u></a> for the personal data of 730,000 Kansans who relied on food assistance or applied for benefits. In 2025, Kobach <a href="https://www.ag.ks.gov/Home/Components/News/News/203/1292"><u>sued</u></a> Kansas Governor Kelly for refusing to turn over the sensitive SNAP data. In 2026, Kobach <a href="https://x.com/KrisKobach1787/status/2018863990349156698"><u>called</u></a> on Kansas lawmakers to force Governor Kelly to submit the SNAP data to Trump’s Department of Agriculture.</p>
          <p>In 2018, Kobach <a href="https://www.breitbart.com/midterm-election/2018/10/17/kris-kobachs-welfare-reform-drug-tests-for-food-stamps-end-benefits-for-illegal-aliens/"><u>proposed</u></a> increasing the work requirements for TANF recipients and implementing work requirements and <a href="https://www.reuters.com/article/business/u-s-tells-georgia-that-drug-testing-of-food-stamp-recipients-violates-law-idUSL1N0OL2Q5/#:~:text=The%20federal%20government%20has%20warned%20the%20state,recipients%20to%20undergo%20drug%20testing%20is%20illegal."><u>illegal</u></a> drug testing requirements for SNAP recipients. Since 2015, Kansas already had one of the <a href="https://kansasreflector.com/2024/10/04/kansas-governor-keen-to-revamp-cash-assistance-program-in-2025/"><u>“trickiest”</u></a> TANF programs for people in need, with only 2,800 recipients by 2023. <a href="https://www.nokidhungry.org/blog/why-more-snap-work-requirements-will-harm-families-and-increase-hunger"><u>No Kid Hungry</u></a> warned that new work requirements for SNAP recipients would increase hunger and threaten access to food for families in need. In 2024, <a href="https://www.fns.usda.gov/data-research/data-visualization/snap-community-characteristics-congressional-district-dashboard"><u>more than 71,000 households in Kansas</u></a> relied on SNAP to afford groceries.</p>
          <p><strong>Message:</strong> Kris Kobach supported handing over sensitive SNAP data to the Trump administration and wanted to impose requirements that would make it harder for Kansans to afford groceries.</p>
          <h3><strong>Kris Kobach Refused To Defend Kansas’ Critical Grants From DOGE Cuts</strong></h3>
          <ul>
            <li>In 2025, Kris Kobach <a href="https://kansasreflector.com/2025/08/14/kobach-asks-federal-court-to-boot-kansas-governor-from-lawsuit-over-federal-funding-cuts/"><u>refused</u></a> to join Kansas Governor Kelly in suing the Trump administration over its devastating DOGE cuts to critical grants. Kobach even <a href="https://kansasreflector.com/2025/08/14/kobach-asks-federal-court-to-boot-kansas-governor-from-lawsuit-over-federal-funding-cuts/"><u>asked</u></a> a federal court to remove Governor Kelly from the multi-state lawsuit challenging Trump’s refusal to provide grant funding to states, even though the lawsuit highlighted the harms of the cuts on states’ abilities to provide services.&nbsp;</li>
            <li>Kobach refused to defend Kansas from DOGE cuts even as DOGE cut critical grants that were intended for Kansas to <a href="https://capitalandmain.com/doge-posts/doge-cuts-grant-to-kansas-for-rural-broadband"><u>address broadband</u></a>, <a href="https://www.cjonline.com/story/news/politics/government/2025/08/04/why-kansas-is-suing-trump-administration-over-doge-cuts/85508345007/?gnt-cfr=1&amp;gca-cat=p&amp;gca-uir=true&amp;gca-epti=z116358p117450c117450e001500v116358d--30--b--30--&amp;gca-ft=100&amp;gca-ds=sophi"><u>food access, flood prevention and mitigation, lead testing, and more</u></a>. DOGE also <a href="https://www.kcur.org/politics-elections-and-government/2026-01-21/trump-cut-2-800-federal-jobs-in-kansas-city-and-thousands-more-in-missouri-and-kansas"><u>targeted</u></a> the livelihoods of more than 11,000 federal workers in Kansas and reduced Kansas’ federal workforce by 15 percent.</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach refused to defend Kansas’ critical grants from DOGE cuts as the cuts hindered Kansas’ ability to provide critical services and federal workers in Kansas were laid off.</p>
          <h3><strong>Kris Kobach Was An Anti-Abortion Extremist</strong></h3>
          <ul>
            <li>Kris Kobach was an out-of-touch anti-abortion extremist who attacked Kansas’ abortion access and <a href="https://www.youtube.com/watch?v=Z24h3qIsmFU"><u>called</u></a> for passing more anti-abortion laws.</li>
            <li>In 2026, Kobach claimed Kansas was the <a href="https://kansasreflector.com/2026/01/28/kansas-leaders-use-annual-rally-to-cast-courts-as-major-hurdle-in-anti-abortion-fight/"><u>“abortion capital of the midwest.”</u></a> He also claimed the Kansas Supreme Court <a href="https://kansasreflector.com/2026/01/28/kansas-leaders-use-annual-rally-to-cast-courts-as-major-hurdle-in-anti-abortion-fight/"><u>“invented an invisible right to an abortion”</u></a> and previously said it would be a <a href="https://www.youtube.com/watch?v=Z24h3qIsmFU"><u>“mistake”</u></a> for the Kansas Supreme Court to rule on an “unwritten right to an abortion in Kansas.”&nbsp;</li>
            <li>In 2023, Kobach <a href="https://apnews.com/article/abortion-politics-kansas-state-government-kris-kobach-e10773d1eb521e6d47d0c9d04f83835c"><u>asked</u></a> the Kansas Supreme Court to reconsider Kansas’ fundamental right to abortion after the overturning of Roe v. Wade, but the Kansas Supreme Court <a href="https://www.nytimes.com/2024/07/05/us/kansas-supreme-court-abortion.html"><u>affirmed</u></a> the right in 2024, which Kobach called “disappointing.”</li>
            <li>Kobach repeatedly threatened Kansans’ access to abortion medication. In 2023, Kobach <a href="https://www.cjonline.com/story/news/healthcare/2023/02/20/after-kris-kobach-letter-walgreens-wont-send-mifepristone-in-kansas/69923382007/"><u>blasted</u></a> Walgreens for planning to distribute mifepristone nationally, resulting in Walgreens saying they would not distribute or mail the abortion-inducing medication in Kansas. Kobach also signed onto a <a href="https://www.cjonline.com/story/news/healthcare/2023/02/20/after-kris-kobach-letter-walgreens-wont-send-mifepristone-in-kansas/69923382007/"><u>legal brief</u></a> in support of a lawsuit seeking to block FDA approval for mifepristone to <a href="https://www.kansascity.com/news/politics-government/article272471905.html"><u>effectively ban abortion medication nationwide</u></a>. He also filed an <a href="https://www.wibw.com/2023/04/18/attorney-general-urges-us-supreme-court-reiterate-right-regulate-abortion/"><u>amicus brief</u></a> urging the U.S. Supreme Court to reject the FDA’s approval of abortion-inducing pills by mail.&nbsp;</li>
            <li>Kobach <a href="https://www.nytimes.com/2024/07/05/us/kansas-supreme-court-abortion.html"><u>defended</u></a> extreme anti-abortion laws in court, including Kansas’ ban on a <a href="https://kansasreflector.com/2024/07/05/kansas-supreme-court-strikes-down-state-law-banning-second-trimester-abortion-procedure/"><u>second-trimester procedure</u></a> and additional licensing requirements for abortion clinics.&nbsp;</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach threatened the reproductive freedoms of Kansans.</p>
          <h3><strong>Kris Kobach Opposed LGBTQ+ Kansans Adopting Children And Getting Married</strong></h3>
          <ul>
            <li>Kris Kobach had a long history of opposing the rights of LGBTQ+ Kansans and using extreme anti-LGBTQ+ language.</li>
            <li>In 2018, Kobach <a href="https://www.salon.com/2018/05/19/kansas-governor-signs-anti-lgbt-adoption-bill-into-law/"><u>supported</u></a> an anti-LGBTQ bill that allowed adoption agencies to refuse adoption or fostering services to same-sex couples and insulated groups “that want to discriminate against the LGBT community.” He also previously said same-sex parents were <a href="https://www.out.com/politics/2020/8/04/peter-thiel-gay-billionaire-funding-anti-lgbtq-republican"><u>“not good for kids.”</u></a></li>
            <li>In 2012, Kobach opposed a platform amendment allowing for the civil unions of same-sex couples and <a href="https://www.mediaite.com/media/tv/romney-advisor-argues-against-civil-unions-in-gop-platform-likens-homosexuality-to-drug-use/"><u>compared same-sex civil unions to polygamy or drug use.</u></a> In 2004, he <a href="https://www.vice.com/en/article/kris-kobach-attorney-general-far-right/"><u>accused</u></a> the Human Rights Campaign of promoting “homosexual pedophilia.”</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach opposed allowing LGBTQ+ Kansans adopt or foster children and used extreme anti-LGBTQ language.</p>
          <h3><strong>Kris Kobach Would Allow Trump To Deploy Federal Forces Against Kansans</strong></h3>
          <ul>
            <li>In 2025, Kris Kobach <a href="https://x.com/KrisKobach1787/status/1936099212577702264"><u>supported</u></a> Trump’s decision to deploy federal forces without the consent of governors. After Governor Kelly joined a legal brief seeking to block Trump’s deployment of the national guard, Kobach <a href="https://x.com/KrisKobach1787/status/1933525651975250383"><u>claimed</u></a> the law gave Trump the authority to deploy federal forces without the consent of governors.&nbsp;</li>
            <li>In December 2025, the U.S. Supreme Court <a href="https://www.bbc.com/news/articles/c9dv1200j44o"><u>ruled</u></a> Trump did not have the <a href="https://www.democracydocket.com/news-alerts/trump-ends-national-guard-deployments-los-angeles-chicago-portland/"><u>authority</u></a> to deploy National Guard troops in Chicago. Despite this ruling, Trump <a href="https://www.nytimes.com/2025/12/31/us/politics/trump-national-guard.html"><u>suggested</u></a> he would “not hesitate to deploy troops in the future.” The Trump administration faced repeated legal challenges for overstepping its authority in deploying federal forces <a href="https://www.nytimes.com/2025/12/31/us/politics/trump-national-guard.html"><u>without</u></a> the consent of governors and mayors across several American cities. In January 2026, Minnesota and Illinois sued the Trump administration over its deployment of federal agents to the Twin Cities and Chicago for immigration operations, arguing the unprecedented deployment of federal officers was a <a href="https://www.cnn.com/2026/01/12/us/minneapolis-immigration-officers-mobilizing-protests"><u>“federal invasion”</u></a> and unconstitutional violation of the <a href="https://www.politico.com/news/2026/01/12/minnesota-sues-trump-ice-minneapolis-00723482?cid=apn"><u>Tenth Amendment.</u></a>&nbsp;</li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach would not protect Kansans from federal forces as Trump continues to test how far he can exceed his authority.</p>
          <h3><strong>Kris Kobach Promoted Baseless Voter Fraud Conspiracies And Helped Strategize A Lawsuit To Overturn The 2020 Election</strong></h3>
          <ul>
            <li>Kris Kobach repeatedly promoted baseless voter fraud conspiracies and called for the elimination of ballot drop boxes.</li>
            <li>Kobach claimed Georgia, Michigan, Pennsylvania, and Wisconsin <a href="https://www.nytimes.com/2021/01/31/us/trump-election-lie.html"><u>“held illegitimate elections”</u></a> and violated the rights of voters in other states during the 2020 election. He claimed <a href="https://apnews.com/article/2022-midterm-elections-voting-rights-kris-kobach-topeka-kansas-a34504e587cc5efcf7f01219b89f03e1"><u>“there’s no question”</u></a> voter fraud occurred in the 2020 election and said Americans would never know “how many fraudulent ballots were cast.”</li>
            <li>Kobach was <a href="https://www.nytimes.com/2021/01/31/us/trump-election-lie.html"><u>part of a team of lawyers with close ties to the Trump 2020 campaign</u></a> that planned a lawsuit to claim “there were enough inappropriate election-rule changes” that could overturn the 2020 election. Kobach helped strategize Texas Attorney General Ken Paxton’s lawsuit seeking to overturn the election, and claimed the lawsuit <a href="https://www.breitbart.com/politics/2020/12/07/kobach-texas-case-challenges-election-directly-at-supreme-court/"><u>presented a “clear” and “compelling case.”</u></a> Kobach argued the swing states violated the constitution when they changed election rules during the 2020 election.&nbsp;</li>
            <li>Kobach called for the <a href="https://apnews.com/article/2022-midterm-elections-voting-rights-kris-kobach-topeka-kansas-a34504e587cc5efcf7f01219b89f03e1"><u>elimination of ballot drop boxes</u></a> despite a lack of voter fraud evidence and Kansas’ Republican Secretary of State, Scott Schwab, assuring Kansas’ elections were secure and drop boxes were safe. Kobach repeatedly claimed mail-in voting was the <a href="https://www.facebook.com/KrisKobach1787/videos/946133025902187"><u>“primary avenue of voter fraud”</u></a> and allowed for <a href="https://x.com/KrisKobach1787/status/1248009370559897600"><u>“ballot harvesting.”</u></a></li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach helped sow distrust in U.S. elections and tried to overturn the 2020 election.</p>
          <h3><strong>Kris Kobach Wasted Millions Of Taxpayer Dollars On Personal And Partisan Political Battles</strong></h3>
          <ul>
            <li>In 2018, Kansas taxpayers were on the hook for <a href="https://www.kansascity.com/news/politics-government/article210247164.html"><u>fees and costs from Kobach’s failed challenge</u></a> against Kansas’ proof-of-citizenship in voting law. Kobach’s loss in the case incurred attorneys fees and potential additional fines for contempt of court after <a href="https://www.cnn.com/2018/04/19/politics/kris-kobach-contempt-of-court/index.html"><u>failing to comply with court orders</u></a>. In handing down the “sweeping defeat,” the judge also ordered Kobach to take a <a href="https://www.kansascity.com/news/politics-government/article215374130.html/"><u>legal education course</u></a> after repeatedly botching courtroom procedure.</li>
            <li>Through his services advising the State of Arizona and several local governments on anti-immigration laws, Kobach lined his pockets and <a href="https://www.americanprogress.org/issues/immigration/reports/2011/01/24/8939/unconstitutional-and-costly/"><u>“ran up an estimated $6.6 million in fees for his efforts”</u></a> at the <a href="https://www.propublica.org/article/kris-kobachs-lucrative-trail-of-courtroom-defeats"><u>expense of taxpayers.</u></a> Kobach advised <a href="https://www.nytimes.com/2017/06/13/magazine/the-man-behind-trumps-voter-fraud-obsession.html"><u>Joe Arpaio and the Maricopa County Sheriff’s Office</u></a> on enforcement of federal immigration law, which cost taxpayers <a href="https://www.azcentral.com/story/news/local/phoenix/2018/05/22/maricopa-county-budget-joe-arpaio-sheriffs-office-reforms-ordered-judge-racial-profiling-lawsuit/630836002/"><u>more than $90 million</u></a>. Kobach’s <a href="https://www.kansascity.com/news/politics-government/article215374130.html"><u>legal work for local governments on immigration resulted in millions in legal fees and costs</u></a> and prompted some localities to either <a href="https://www.americanprogress.org/issues/immigration/reports/2011/01/24/8939/unconstitutional-and-costly/"><u>raise taxes or cut services.</u></a></li>
          </ul>
          <p><strong>Message:</strong> Kris Kobach lined his pockets at the expense of taxpayers on personal and partisan battles.</p>
